<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lil Free Discography Wiki</title>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --container-bg: #141414;
            --text-color: #c5a059;
            --text-secondary: #ffffff;
            --accent-color: #c5a059;
            --status-released: #2ecc71;
            --status-deleted: #e74c3c;
            --status-unreleased: #f1c40f;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--bg-color);
            color: var(--text-secondary);
            margin: 0;
            padding: 20px;
            padding-bottom: 40px;
        }

        header {
            text-align: center;
            padding: 40px 0;
            border-bottom: 2px dashed var(--accent-color);
            margin-bottom: 30px;
        }

        header h1 {
            color: var(--text-color);
            font-size: 2.5rem;
            margin: 0 0 10px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .tabs {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .tab-btn {
            background: transparent;
            border: 2px solid var(--accent-color);
            color: var(--accent-color);
            padding: 10px 20px;
            font-size: 1rem;
            cursor: pointer;
            font-family: inherit;
            text-transform: uppercase;
            transition: all 0.3s;
        }

        .tab-btn.active, .tab-btn:hover {
            background: var(--accent-color);
            color: var(--bg-color);
            font-weight: bold;
        }

        .content-section {
            display: none;
            max-width: 1000px;
            margin: 0 auto;
        }

        .content-section.active {
            display: block;
        }

        .album-block {
            background-color: var(--container-bg);
            border: 1px solid #c5a05922;
            border-radius: 4px;
            margin-bottom: 30px;
            padding: 20px;
        }

        .album-header {
            font-size: 1.4rem;
            color: var(--text-color);
            margin-bottom: 15px;
            border-bottom: 1px solid #c5a05922;
            padding-bottom: 5px;
            text-transform: uppercase;
        }

        .track-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        .track-table th, .track-table td {
            text-align: left;
            padding: 12px 10px;
            border-bottom: 1px solid #c5a05911;
        }

        .track-table th {
            color: var(--text-color);
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        .status-badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .status-released { background-color: rgba(46, 204, 113, 0.15); color: var(--status-released); border: 1px solid var(--status-released); }
        .status-deleted { background-color: rgba(231, 76, 60, 0.15); color: var(--status-deleted); border: 1px solid var(--status-deleted); }
        .status-unreleased { background-color: rgba(241, 196, 15, 0.15); color: var(--status-unreleased); border: 1px solid var(--status-unreleased); }
    </style>
</head>
<body>

    <header>
        <h1>Lil Free</h1>
        <div style="color: #888;">Официальный архив треков и дискографии</div>
    </header>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('albums')">Альбомы и EP</button>
        <button class="tab-btn" onclick="switchTab('singles')">Синглы</button>
        <button class="tab-btn" onclick="switchTab('features')">Участие</button>
    </div>

    <div id="albums" class="content-section active">
        <div id="albums-list">Загрузка релизов...</div>
    </div>

    <div id="singles" class="content-section">
        <div class="album-block">
            <div class="album-header">Все официальные синглы</div>
            <table class="track-table">
                <thead>
                    <tr>
                        <th style="width: 5%">№</th>
                        <th style="width: 35%">Название трека</th>
                        <th style="width: 25%">Продюсер</th>
                        <th style="width: 20%">Дата релиза</th>
                        <th style="width: 15%">Статус</th>
                    </tr>
                </thead>
                <tbody id="singles-rows"></tbody>
            </table>
        </div>
    </div>

    <div id="features" class="content-section">
        <div class="album-block">
            <div class="album-header">Гостевые участия и коллаборации</div>
            <table class="track-table">
                <thead>
                    <tr>
                        <th style="width: 5%">№</th>
                        <th style="width: 30%">Название трека</th>
                        <th style="width: 25%">Исполнитель</th>
                        <th style="width: 25%">Информация</th>
                        <th style="width: 15%">Статус</th>
                    </tr>
                </thead>
                <tbody id="features-rows"></tbody>
            </table>
        </div>
    </div>
    <script>
        // Твой персональный ключ публикации Google Таблицы
        const SHEET_ID = '1sTsOAYhRZPGscsrzeo0UjdSj2200WehO3vI9g8d6CFw';
        
        // Надежный парсер CSV строк, который не боится кавычек и запятых внутри ячеек
        function parseCSVLine(text) {
            let p = '', r = [];
            let q = false;
            for (let i = 0; i < text.length; i++) {
                let c = text[i];
                if (c === '"') { q = !q; }
                else if (c === ',' && !q) { r.push(p.trim()); p = ''; }
                else { p += c; }
            }
            r.push(p.trim());
            return r.map(v => v.replace(/^"|"$/g, '').trim());
        }

        async function loadAllTabsData() {
            try {
                // Подгружаем вкладку 1 (Album)
                const albumUrl = `https://google.com{SHEET_ID}/pub?output=csv&sheet=Album`;
                const albumResponse = await fetch(albumUrl);
                const albumText = await albumResponse.text();
                
                // Подгружаем вкладку 2 (Singles)
                const singlesUrl = `https://google.com{SHEET_ID}/pub?output=csv&sheet=Singles`;
                const singlesResponse = await fetch(singlesUrl);
                const singlesText = await singlesResponse.text();

                // Подгружаем вкладку 3 (Features)
                const featuresUrl = `https://google.com{SHEET_ID}/pub?output=csv&sheet=Features`;
                const featuresResponse = await fetch(featuresUrl);
                const featuresText = await featuresResponse.text();

                // Превращаем текст в чистые массивы строк
                const processRows = (text) => text.split('\n').map(line => parseCSVLine(line)).filter(row => row.length > 1);

                renderAlbums(processRows(albumText));
                renderSingles(processRows(singlesText));
                renderFeatures(processRows(featuresText));

            } catch (error) {
                console.error("Критическая ошибка разбора данных:", error);
                document.getElementById('albums-list').innerText = "Ошибка загрузки структуры. Убедись, что документ опубликован как веб-страница.";
            }
        }

        function renderAlbums(rows) {
            const container = document.getElementById('albums-list');
            container.innerHTML = '';
            let currentAlbum = '';
            let currentTableBody = null;

            rows.forEach((row, index) => {
                if (index === 0) return; // Пропуск шапки

                const albumName = row[0];
                const num = row[1];
                const songName = row[2];
                const artists = row[3] || 'Lil Free';
                const producers = row[4] || 'Unknown';
                const info = row[5];
                const date = row[6] || 'N/A';
                const status = (row[7] || 'Released').toLowerCase();

                if (!songName) return;

                let statusClass = 'status-released';
                if (status.includes('delete')) statusClass = 'status-deleted';
                if (status.includes('unrelease') || status.includes('lost')) statusClass = 'status-unreleased';

                if (currentAlbum !== albumName && albumName) {
                    currentAlbum = albumName;
                    const block = document.createElement('div');
                    block.className = 'album-block';
                    block.innerHTML = `
                        <div class="album-header">${currentAlbum} (${date})</div>
                        <table class="track-table">
                            <thead>
                                <tr>
                                    <th style="width: 5%">№</th>
                                    <th style="width: 45%">Название трека</th>
                                    <th style="width: 30%">Продюсер</th>
                                    <th style="width: 20%">Статус</th>
                                </tr>
                            </thead>
                            <tbody id="album-tbody-${index}"></tbody>
                        </table>
                    `;
                    container.appendChild(block);
                    currentTableBody = document.getElementById(`album-tbody-${index}`);
                }

                if (currentTableBody) {
                    let nameDisplay = `<strong>${songName}</strong>`;
                    if (info && info !== '—') {
                        nameDisplay += `<br><small style="color: #c5a059aa; font-size:0.8rem">${info}</small>`;
                    }
                    if (artists !== 'Lil Free') {
                        nameDisplay += `<br><small style="color: #666; font-size:0.75rem">${artists}</small>`;
                    }

                    currentTableBody.innerHTML += `
                        <tr>
                            <td>${num}</td>
                            <td>${nameDisplay}</td>
                            <td>${producers}</td>
                            <td><span class="status-badge ${statusClass}">${status}</span></td>
                        </tr>
                    `;
                }
            });
            if (container.innerHTML === '') container.innerText = 'Список релизов пуст.';
        }

        function renderSingles(rows) {
            const container = document.getElementById('singles-rows');
            container.innerHTML = '';

            rows.forEach((row, index) => {
                if (index === 0) return;
                const songName = row[2];
                if (!songName) return;

                const num = row[1];
                const producers = row[4] || 'Unknown';
                const info = row[5];
                const date = row[6] || 'N/A';
                const status = (row[7] || 'Released').toLowerCase();

                let statusClass = 'status-released';
                if (status.includes('delete')) statusClass = 'status-deleted';
                if (status.includes('unrelease') || status.includes('lost')) statusClass = 'status-unreleased';

                let nameDisplay = `<strong>${songName}</strong>`;
                if (info && info !== '—') {
                    nameDisplay += `<br><small style="color: #c5a059aa; font-size:0.8rem">${info}</small>`;
                }

                container.innerHTML += `
                    <tr>
                        <td>${num}</td>
                        <td>${nameDisplay}</td>
                        <td>${producers}</td>
                        <td>${date}</td>
                        <td><span class="status-badge ${statusClass}">${status}</span></td>
                    </tr>
                `;
            });
        }

        function renderFeatures(rows) {
            const container = document.getElementById('features-rows');
            container.innerHTML = '';

            rows.forEach((row, index) => {
                if (index === 0) return;
                const songName = row[2];
                if (!songName) return;

                const num = row[1];
                const artists = row[3] || 'Unknown';
                const info = row[5] || '—';
                const status = (row[7] || 'Released').toLowerCase();

                let statusClass = 'status-released';
                if (status.includes('delete')) statusClass = 'status-deleted';
                if (status.includes('unrelease') || status.includes('lost')) statusClass = 'status-unreleased';

                container.innerHTML += `
                    <tr>
                        <td>${num}</td>
                        <td><strong>${songName}</strong></td>
                        <td>${artists}</td>
                        <td><small>${info}</small></td>
                        <td><span class="status-badge ${statusClass}">${status}</span></td>
                    </tr>
                `;
            });
        }

        function switchTab(tabId) {
            document.querySelectorAll('.content-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        loadAllTabsData();
    </script>
</body>
</html>
