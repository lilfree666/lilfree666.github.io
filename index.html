<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lil Free Discography Wiki</title>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --container-bg: #141414;
            --text-color: #c5a059;
            --text-secondary: #ffffff;
            --accent-color: #c5a059;
            --status-released: #2ecc71;
            --status-deleted: #e74c3c;
            --status-unreleased: #f1c40f;
        }
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--bg-color);
            color: var(--text-secondary);
            margin: 0;
            padding: 20px;
            padding-bottom: 40px;
        }
        header {
            text-align: center;
            padding: 40px 0;
            border-bottom: 2px dashed var(--accent-color);
            margin-bottom: 30px;
        }
        header h1 {
            color: var(--text-color);
            font-size: 2.5rem;
            margin: 0 0 10px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .tabs {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }
        .tab-btn {
            background: transparent;
            border: 2px solid var(--accent-color);
            color: var(--accent-color);
            padding: 10px 20px;
            font-size: 1rem;
            cursor: pointer;
            font-family: inherit;
            text-transform: uppercase;
            transition: all 0.3s;
        }
        .tab-btn.active, .tab-btn:hover {
            background: var(--accent-color);
            color: var(--bg-color);
            font-weight: bold;
        }
        .content-section {
            display: none;
            max-width: 1000px;
            margin: 0 auto;
        }
        .content-section.active {
            display: block;
        }
        .album-block {
            background-color: var(--container-bg);
            border: 1px solid #c5a05922;
            border-radius: 4px;
            margin-bottom: 30px;
            padding: 20px;
        }
        .album-header {
            font-size: 1.4rem;
            color: var(--text-color);
            margin-bottom: 15px;
            border-bottom: 1px solid #c5a05922;
            padding-bottom: 5px;
            text-transform: uppercase;
        }
        .track-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        .track-table th, .track-table td {
            text-align: left;
            padding: 12px 10px;
            border-bottom: 1px solid #c5a05911;
        }
        .track-table th {
            color: var(--text-color);
            text-transform: uppercase;
            font-size: 0.9rem;
        }
        .status-badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
        }
        .status-released { background-color: rgba(46, 204, 113, 0.15); color: var(--status-released); border: 1px solid var(--status-released); }
        .status-deleted { background-color: rgba(231, 76, 60, 0.15); color: var(--status-deleted); border: 1px solid var(--status-deleted); }
        .status-unreleased { background-color: rgba(241, 196, 15, 0.15); color: var(--status-unreleased); border: 1px solid var(--status-unreleased); }
    </style>
</head>
<body>

    <header>
        <h1>Lil Free</h1>
        <div style="color: #888;">Официальный архив треков и дискографии</div>
    </header>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('albums')">Альбомы и EP</button>
        <button class="tab-btn" onclick="switchTab('singles')">Синглы</button>
        <button class="tab-btn" onclick="switchTab('features')">Участие</button>
    </div>

    <!-- Раздел Альбомов -->
    <div id="albums" class="content-section active">
        <div id="albums-list">Загрузка релизов из базы данных...</div>
    </div>

    <!-- Раздел Синглов -->
    <div id="singles" class="content-section">
        <div class="album-block">
            <div class="album-header">Все официальные синглы</div>
            <table class="track-table">
                <thead>
                    <tr>
                        <th style="width: 5%">№</th>
                        <th style="width: 35%">Название трека</th>
                        <th style="width: 25%">Продюсер</th>
                        <th style="width: 20%">Дата релиза</th>
                        <th style="width: 15%">Статус</th>
                    </tr>
                </thead>
                <tbody id="singles-rows"></tbody>
            </table>
        </div>
    </div>

    <!-- Раздел Участия -->
    <div id="features" class="content-section">
        <div class="album-block">
            <div class="album-header">Гостевые участия и коллаборации</div>
            <table class="track-table">
                <thead>
                    <tr>
                        <th style="width: 5%">№</th>
                        <th style="width: 30%">Название трека</th>
                        <th style="width: 25%">Исполнитель</th>
                        <th style="width: 25%">Информация</th>
                        <th style="width: 15%">Статус</th>
                    </tr>
                </thead>
                <tbody id="features-rows"></tbody>
            </table>
        </div>
    </div>
        <script>
        // Идентификатор таблицы базы данных
        const SPREADSHEET_ID = '1sTsOAYhRZPGscsrzeo0UjdSj2200WehO3vI9g8d6CFw';

        // Безопасный запрос к JSON-коннектору Google API без CORS-конфликтов
        async function fetchSheetTab(sheetName) {
            const url = `https://google.com{SPREADSHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheetName)}`;
            const response = await fetch(url);
            const text = await response.text();
            // Вырезаем чистый JSON-массив из обертки Google API
            const jsonText = text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1);
            const data = JSON.parse(jsonText);
            return data.table.rows;
        }

        async function loadAllTabsData() {
            try {
                const albumRows = await fetchSheetTab('Album');
                const singlesRows = await fetchSheetTab('Singles');
                const featuresRows = await fetchSheetTab('Features');

                renderAlbums(albumRows);
                renderSingles(singlesRows);
                renderFeatures(featuresRows);
            } catch (error) {
                console.error("Технический сбой загрузки структуры:", error);
                document.getElementById('albums-list').innerText = "Не удалось загрузить структуру треков. Проверь настройки общего доступа в таблице.";
            }
        }

        function extractValue(cells, index) {
            if (!cells || !cells[index]) return '';
            return cells[index].f || (cells[index].v !== null && cells[index].v !== undefined ? String(cells[index].v) : '');
        }

        function renderAlbums(rows) {
            const container = document.getElementById('albums-list');
            container.innerHTML = '';
            let currentAlbum = '';
            let currentTableBody = null;

            rows.forEach((row, index) => {
                if (index === 0) return; // Пропуск заголовков
                const cells = row.c;
                if (!cells) return;

                const albumName = extractValue(cells, 0);
                const num = extractValue(cells, 1);
                const songName = extractValue(cells, 2);
                const artists = extractValue(cells, 3) || 'Lil Free';
                const producers = extractValue(cells, 4) || 'Unknown';
                const info = extractValue(cells, 5);
                const date = extractValue(cells, 6) || 'N/A';
                const status = extractValue(cells, 7).toLowerCase().trim();

                if (!songName) return;

                let statusClass = 'status-released';
                if (status.includes('delete')) statusClass = 'status-deleted';
                if (status.includes('unrelease') || status.includes('lost')) statusClass = 'status-unreleased';

                if (currentAlbum !== albumName && albumName) {
                    currentAlbum = albumName;
                    const block = document.createElement('div');
                    block.className = 'album-block';
                    block.innerHTML = `
                        <div class="album-header">${currentAlbum} (${date})</div>
                        <table class="track-table">
                            <thead>
                                <tr>
                                    <th style="width: 5%">№</th>
                                    <th style="width: 45%">Название трека</th>
                                    <th style="width: 30%">Продюсер</th>
                                    <th style="width: 20%">Статус</th>
                                </tr>
                            </thead>
                            <tbody id="album-tbody-${index}"></tbody>
                        </table>
                    `;
                    container.appendChild(block);
                    currentTableBody = document.getElementById(`album-tbody-${index}`);
                }

                if (currentTableBody) {
                    let nameDisplay = `<strong>${songName}</strong>`;
                    if (info && info !== '—' && info !== '-') {
                        nameDisplay += `<br><small style="color: #c5a059aa; font-size:0.8rem">${info}</small>`;
                    }
                    if (artists !== 'Lil Free') {
                        nameDisplay += `<br><small style="color: #666; font-size:0.75rem">${artists}</small>`;
                    }

                    currentTableBody.innerHTML += `
                        <tr>
                            <td>${num}</td>
                            <td>${nameDisplay}</td>
                            <td>${producers}</td>
                            <td><span class="status-badge ${statusClass}">${status}</span></td>
                        </tr>
                    `;
                }
            });
            if (container.innerHTML === '') container.innerText = 'Список релизов пуст.';
        }

        function renderSingles(rows) {
            const container = document.getElementById('singles-rows');
            container.innerHTML = '';

            rows.forEach((row, index) => {
                if (index === 0) return;
                const cells = row.c;
                if (!cells) return;

                const num = extractValue(cells, 1);
                const songName = extractValue(cells, 2);
                const producers = extractValue(cells, 4) || 'Unknown';
                const info = extractValue(cells, 5);
                const date = extractValue(cells, 6) || 'N/A';
                const status = extractValue(cells, 7).toLowerCase().trim();

                if (!songName) return;

                let statusClass = 'status-released';
                if (status.includes('delete')) statusClass = 'status-deleted';
                if (status.includes('unrelease') || status.includes('lost')) statusClass = 'status-unreleased';

                let nameDisplay = `<strong>${songName}</strong>`;
                if (info && info !== '—' && info !== '-') {
                    nameDisplay += `<br><small style="color: #c5a059aa; font-size:0.8rem">${info}</small>`;
                }

                container.innerHTML += `
                    <tr>
                        <td>${num}</td>
                        <td>${nameDisplay}</td>
                        <td>${producers}</td>
                        <td>${date}</td>
                        <td><span class="status-badge ${statusClass}">${status}</span></td>
                    </tr>
                `;
            });
        }

        function renderFeatures(rows) {
            const container = document.getElementById('features-rows');
            container.innerHTML = '';

            rows.forEach((row, index) => {
                if (index === 0) return;
                const cells = row.c;
                if (!cells) return;

                const num = extractValue(cells, 1);
                const songName = extractValue(cells, 2);
                const artists = extractValue(cells, 3) || 'Unknown';
                const info = extractValue(cells, 5) || '—';
                const status = extractValue(cells, 7).toLowerCase().trim();

                if (!songName) return;

                let statusClass = 'status-released';
                if (status.includes('delete')) statusClass = 'status-deleted';
                if (status.includes('unrelease') || status.includes('lost')) statusClass = 'status-unreleased';

                container.innerHTML += `
                    <tr>
                        <td>${num}</td>
                        <td><strong>${songName}</strong></td>
                        <td>${artists}</td>
                        <td><small>${info}</small></td>
                        <td><span class="status-badge ${statusClass}">${status}</span></td>
                    </tr>
                `;
            });
        }

        function switchTab(tabId) {
            document.querySelectorAll('.content-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        loadAllTabsData();
    </script>
</body>
</html>
