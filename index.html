<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lil Free Discography Wiki</title>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --container-bg: #141414;
            --text-color: #c5a059;
            --text-secondary: #ffffff;
            --accent-color: #c5a059;
            --status-released: #2ecc71;
            --status-deleted: #e74c3c;
            --status-unreleased: #f1c40f;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--bg-color);
            color: var(--text-secondary);
            margin: 0;
            padding: 20px;
            padding-bottom: 40px;
        }

        header {
            text-align: center;
            padding: 40px 0;
            border-bottom: 2px dashed var(--accent-color);
            margin-bottom: 30px;
        }

        header h1 {
            color: var(--text-color);
            font-size: 2.5rem;
            margin: 0 0 10px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .tabs {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .tab-btn {
            background: transparent;
            border: 2px solid var(--accent-color);
            color: var(--accent-color);
            padding: 10px 20px;
            font-size: 1rem;
            cursor: pointer;
            font-family: inherit;
            text-transform: uppercase;
            transition: all 0.3s;
        }

        .tab-btn.active, .tab-btn:hover {
            background: var(--accent-color);
            color: var(--bg-color);
            font-weight: bold;
        }

        .content-section {
            display: none;
            max-width: 1000px;
            margin: 0 auto;
        }

        .content-section.active {
            display: block;
        }

        .album-block {
            background-color: var(--container-bg);
            border: 1px solid #c5a05922;
            border-radius: 4px;
            margin-bottom: 30px;
            padding: 20px;
        }

        .album-header {
            font-size: 1.4rem;
            color: var(--text-color);
            margin-bottom: 15px;
            border-bottom: 1px solid #c5a05922;
            padding-bottom: 5px;
            text-transform: uppercase;
        }

        .track-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        .track-table th, .track-table td {
            text-align: left;
            padding: 12px 10px;
            border-bottom: 1px solid #c5a05911;
        }

        .track-table th {
            color: var(--text-color);
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        .status-badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .status-released { background-color: rgba(46, 204, 113, 0.15); color: var(--status-released); border: 1px solid var(--status-released); }
        .status-deleted { background-color: rgba(231, 76, 60, 0.15); color: var(--status-deleted); border: 1px solid var(--status-deleted); }
        .status-unreleased { background-color: rgba(241, 196, 15, 0.15); color: var(--status-unreleased); border: 1px solid var(--status-unreleased); }

        .play-btn {
            background: var(--accent-color);
            color: var(--bg-color);
            border: none;
            padding: 5px 10px;
            cursor: pointer;
            border-radius: 3px;
            font-weight: bold;
            text-decoration: none;
            display: inline-block;
            font-size: 0.8rem;
        }

        .play-btn.disabled {
            background: #222;
            color: #555;
            cursor: not-allowed;
            border: 1px solid #333;
        }
    </style>
</head>
<body>

    <header>
        <h1>Lil Free</h1>
        <div style="color: #888;">Официальный архив треков и дискографии</div>
    </header>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('albums')">Альбомы и EP</button>
        <button class="tab-btn" onclick="switchTab('singles')">Синглы</button>
        <button class="tab-btn" onclick="switchTab('features')">Участие</button>
    </div>

    <!-- Раздел Альбомов -->
    <div id="albums" class="content-section active">
        <div id="albums-list">Загрузка релизов из базы данных...</div>
    </div>

    <!-- Раздел Синглов -->
    <div id="singles" class="content-section">
        <div class="album-block">
            <div class="album-header">Все официальные синглы</div>
            <table class="track-table">
                <thead>
                    <tr>
                        <th style="width: 5%">№</th>
                        <th style="width: 35%">Название трека</th>
                        <th style="width: 25%">Продюсер</th>
                        <th style="width: 20%">Дата релиза</th>
                        <th style="width: 15%">Статус</th>
                    </tr>
                </thead>
                <tbody id="singles-rows"></tbody>
            </table>
        </div>
    </div>

    <!-- Раздел Участия -->
    <div id="features" class="content-section">
        <div class="album-block">
            <div class="album-header">Гостевые участия и коллаборации</div>
            <table class="track-table">
                <thead>
                    <tr>
                        <th style="width: 5%">№</th>
                        <th style="width: 30%">Название трека</th>
                        <th style="width: 25%">Исполнитель</th>
                        <th style="width: 25%">Информация</th>
                        <th style="width: 15%">Статус</th>
                    </tr>
                </thead>
                <tbody id="features-rows"></tbody>
            </table>
        </div>
    </div>
    <script>
        // Твой новый актуальный идентификатор Google таблицы
        const SHEET_ID = 'e/2PACX-1vTUmADHVuVWOPKxRf7wowfpGKMlsqsQYJjrLLE8X2BS9f4ap7ISavkcONHrI6JtOF83QoHro1zNoWzv';
;
        
        // Магия для последовательного чтения отдельных листов через Google API
        async function loadAllTabsData() {
            try {
                // Загружаем вкладку 1 (Альбомы и EP) — первый лист по умолчанию
                const albumUrl = `https://google.com{SHEET_ID}/gviz/tq?tqx=out:json&sheet=Album`;
                const albumResponse = await fetch(albumUrl);
                const albumText = await albumResponse.text();
                const albumData = JSON.parse(albumText.substr(47).slice(0, -2));
                
                // Загружаем вкладку 2 (Синглы) по названию листа
                const singlesUrl = `https://google.com{SHEET_ID}/gviz/tq?tqx=out:json&sheet=Singles`;
                const singlesResponse = await fetch(singlesUrl);
                const singlesText = await singlesResponse.text();
                const singlesData = JSON.parse(singlesText.substr(47).slice(0, -2));

                // Загружаем вкладку 3 (Участие) по названию листа
                const featuresUrl = `https://google.com{SHEET_ID}/gviz/tq?tqx=out:json&sheet=Features`;
                const featuresResponse = await fetch(featuresUrl);
                const featuresText = await featuresResponse.text();
                const featuresData = JSON.parse(featuresText.substr(47).slice(0, -2));

                processAlbums(albumData.table.rows);
                processSingles(singlesData.table.rows);
                processFeatures(featuresData.table.rows);

            } catch (error) {
                console.error("Ошибка загрузки данных из таблицы:", error);
                document.getElementById('albums-list').innerText = "Не удалось подгрузить данные. Пожалуйста, убедись, что в новой таблице открыт доступ по ссылке (Читатель) и обновлена страница.";
            }
        }

        // Вспомогательная функция безопасного извлечения текста из ячеек
        function getCellVal(cells, idx) {
            if (!cells || !cells[idx]) return '';
            if (cells[idx].f) return cells[idx].f; // Форматированный текст
            return cells[idx].v !== null && cells[idx].v !== undefined ? cells[idx].v : '';
        }

        // Разбор первой вкладки (Альбомы)
        function processAlbums(rows) {
            const container = document.getElementById('albums-list');
            container.innerHTML = '';
            let currentAlbum = '';
            let currentTableBody = null;

            rows.forEach((row, index) => {
                if (index === 0) return; // Скипаем шапку
                const cells = row.c;
                if (!cells) return;

                const albumName = getCellVal(cells, 0);
                const num = getCellVal(cells, 1);
                const songName = getCellVal(cells, 2);
                const artists = getCellVal(cells, 3) || 'Lil Free';
                const producers = getCellVal(cells, 4) || 'Unknown';
                const info = getCellVal(cells, 5);
                const date = getCellVal(cells, 6) || 'N/A';
                const status = (getCellVal(cells, 7) || 'Released').trim().toLowerCase();

                if (!songName) return;

                let statusClass = 'status-released';
                if (status === 'deleted') statusClass = 'status-deleted';
                if (status === 'unreleased' || status === 'lost') statusClass = 'status-unreleased';

                // Если начался новый релиз — создаем блок
                if (currentAlbum !== albumName && albumName) {
                    currentAlbum = albumName;
                    const block = document.createElement('div');
                    block.className = 'album-block';
                    block.innerHTML = `
                        <div class="album-header">${currentAlbum} (${date})</div>
                        <table class="track-table">
                            <thead>
                                <tr>
                                    <th style="width: 5%">№</th>
                                    <th style="width: 45%">Название трека</th>
                                    <th style="width: 30%">Продюсер</th>
                                    <th style="width: 20%">Статус</th>
                                </tr>
                            </thead>
                            <tbody id="album-tbody-${index}"></tbody>
                        </table>
                    `;
                    container.appendChild(block);
                    currentTableBody = document.getElementById(`album-tbody-${index}`);
                }

                if (currentTableBody) {
                    let nameDisplay = `<strong>${songName}</strong>`;
                    if (info && info !== '—') {
                        nameDisplay += `<br><small style="color: #c5a059aa; font-size:0.8rem">${info}</small>`;
                    }
                    if (artists !== 'Lil Free') {
                        nameDisplay += `<br><small style="color: #666; font-size:0.75rem">${artists}</small>`;
                    }

                    currentTableBody.innerHTML += `
                        <tr>
                            <td>${num}</td>
                            <td>${nameDisplay}</td>
                            <td>${producers}</td>
                            <td><span class="status-badge ${statusClass}">${status}</span></td>
                        </tr>
                    `;
                }
            });
            if (container.innerHTML === '') container.innerText = 'Список альбомов пуст.';
        }

        // Разбор второй вкладки (Синглы)
        function processSingles(rows) {
            const container = document.getElementById('singles-rows');
            container.innerHTML = '';

            rows.forEach((row, index) => {
                if (index === 0) return;
                const cells = row.c;
                if (!cells) return;

                const num = getCellVal(cells, 1);
                const songName = getCellVal(cells, 2);
                const producers = getCellVal(cells, 4) || 'Unknown';
                const info = getCellVal(cells, 5);
                const date = getCellVal(cells, 6) || 'N/A';
                const status = (getCellVal(cells, 7) || 'Released').trim().toLowerCase();

                if (!songName) return;

                let statusClass = 'status-released';
                if (status === 'deleted') statusClass = 'status-deleted';
                if (status === 'unreleased' || status === 'lost') statusClass = 'status-unreleased';

                let nameDisplay = `<strong>${songName}</strong>`;
                if (info && info !== '—') {
                    nameDisplay += `<br><small style="color: #c5a059aa; font-size:0.8rem">${info}</small>`;
                }

                container.innerHTML += `
                    <tr>
                        <td>${num}</td>
                        <td>${nameDisplay}</td>
                        <td>${producers}</td>
                        <td>${date}</td>
                        <td><span class="status-badge ${statusClass}">${status}</span></td>
                    </tr>
                `;
            });
            if (container.innerHTML === '') container.innerHTML = '<tr><td colspan="5" style="text-align:center">Список синглов пуст.</td></tr>';
        }

        // Разбор третьей вкладки (Участие)
        function processFeatures(rows) {
            const container = document.getElementById('features-rows');
            container.innerHTML = '';

            rows.forEach((row, index) => {
                if (index === 0) return;
                const cells = row.c;
                if (!cells) return;

                const num = getCellVal(cells, 1);
                const songName = getCellVal(cells, 2);
                const artists = getCellVal(cells, 3) || 'Unknown';
                const info = getCellVal(cells, 5) || '—';
                const status = (getCellVal(cells, 7) || 'Released').trim().toLowerCase();

                if (!songName) return;

                let statusClass = 'status-released';
                if (status === 'deleted') statusClass = 'status-deleted';
                if (status === 'unreleased' || status === 'lost') statusClass = 'status-unreleased';

                container.innerHTML += `
                    <tr>
                        <td>${num}</td>
                        <td><strong>${songName}</strong></td>
                        <td>${artists}</td>
                        <td><small>${info}</small></td>
                        <td><span class="status-badge ${statusClass}">${status}</span></td>
                    </tr>
                `;
            });
            if (container.innerHTML === '') container.innerHTML = '<tr><td colspan="5" style="text-align:center">Список участий пуст.</td></tr>';
        }

        function switchTab(tabId) {
            document.querySelectorAll('.content-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        loadAllTabsData();
    </script>
</body>
</html>
